<svg xmlns="http://www.w3.org/2000/svg" width="394" height="64" viewBox="0 0 394 64">
  <!-- Jewbuntu wordmark with "for Asahi Linux", for dark backgrounds (Fedora Asahi Remix login
       screen). Original artwork; no Asahi or Fedora logo is used. GDM draws the logo 48 px high. -->
  <g fill="none" stroke="#f6e7c4" stroke-width="3.6" stroke-linejoin="round">
    <path d="M32 9 L53 45 L11 45 Z"/>
    <path d="M32 57 L11 21 L53 21 Z"/>
  </g>
  <text x="68" y="44" font-family="Inter, 'Noto Sans', sans-serif" fill="#ffffff">
    <tspan font-size="34" font-weight="600" letter-spacing="0.5">Jewbuntu</tspan>
    <tspan dx="8" font-size="19" font-weight="500" fill-opacity="0.82" letter-spacing="0.3">for Asahi Linux</tspan>
  </text>
</svg>
