<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Prefer fonts with clear nikud for Hebrew text, without changing Latin fonts.
     prepend_first edits apply in order, so the last listed family ends up first.
     Ezra SIL (fonts-sil-ezra) is installed for full nikud + teamim and can be chosen per document. -->
<fontconfig>
  <match target="pattern">
    <test name="lang" compare="contains"><string>he</string></test>
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Sans Hebrew</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>he</string></test>
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Frank Ruehl CLM</string></edit>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Serif Hebrew</string></edit>
  </match>
</fontconfig>
