# Jewbuntu settings for Lynx, used by the "Lynx Web Browser" menu entry
# (lynx -cfg=/usr/share/jewbuntu/lynx/lynx.cfg). Lynx's own settings are read first and stay
# untouched; the lines below override them. Typing plain `lynx` in a terminal skips them.
# Ubuntu keeps Lynx's settings in /etc/lynx/lynx.cfg (Arch in /etc/lynx.cfg). Without them Lynx has
# no SSL_CERT_FILE and every https page fails ("Can't access startfile", seen 2026-11-26).
INCLUDE:/etc/lynx/lynx.cfg
# Start on a search page built for text browsers.
STARTFILE:https://lite.duckduckgo.com/lite/
HELPFILE:https://lynx.invisible-island.net/lynx_help/lynx_help_main.html
CHARACTER_SET:utf-8
ASSUME_CHARSET:utf-8
ASSUME_LOCAL_CHARSET:utf-8
PREFERRED_CHARSET:utf-8
# Jewbuntu colours that stay readable on the terminal's white background (and on dark ones).
# Some Lynx builds ignore COLOR_STYLE here and keep /etc/lynx.lss, so the menu entry
# also passes -lss=/usr/share/jewbuntu/lynx/jewbuntu.lss.
COLOR_STYLE:/usr/share/jewbuntu/lynx/jewbuntu.lss
DEFAULT_COLORS:TRUE
# Friendlier defaults for newcomers. Cookies are accepted without asking but kept only until
# Lynx closes (PERSISTENT_COOKIES:FALSE).
ACCEPT_ALL_COOKIES:TRUE
SET_COOKIES:TRUE
PERSISTENT_COOKIES:FALSE
USE_MOUSE:TRUE
VI_KEYS_ALWAYS_ON:FALSE
NUMBER_LINKS_ON_LEFT:FALSE
SHOW_CURSOR:FALSE
SCROLLBAR:TRUE
MINIMAL_COMMENTS:TRUE
# Certificate problems are always asked about (Lynx's default FORCE_SSL_PROMPT:prompt).
