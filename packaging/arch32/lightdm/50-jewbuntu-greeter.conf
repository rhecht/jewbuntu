# LightDM GTK greeter: Jewbuntu skin, icons, font and wallpaper on the login screen.
# (Package data in /usr/share/lightdm/lightdm-gtk-greeter.conf.d; settings in
# /etc/lightdm/lightdm-gtk-greeter.conf still win.)
[greeter]
theme-name=Jewbuntu-Light-solid
icon-theme-name=Jewbuntu-light
font-name=Inter 10
background=/usr/share/backgrounds/Jewbuntu/Jewbuntu-star-blue.jpg
default-user-image=#avatar-default
indicators=~host;~spacer;~clock;~spacer;~layout;~session;~power
clock-format=%a %-d %b  %H:%M
