# Jewbuntu login screen on Fedora (jewbuntu-asahi-desktop). GLib serves gnome-shell's built-in
# theme files from this folder first, when a file is there: only gdm*.css and Jewbuntu's own
# assets, so it changes the login screen (GDM) and nothing in a user's session. The folder is a
# link that jewbuntu-login-theme removes when the skin does not match the installed GNOME, and
# then nothing is overlaid. Remove jewbuntu-asahi-desktop and this file goes with it.
G_RESOURCE_OVERLAYS=/org/gnome/shell/theme=/usr/share/jewbuntu/gdm-overlay${G_RESOURCE_OVERLAYS:+:${G_RESOURCE_OVERLAYS}}
