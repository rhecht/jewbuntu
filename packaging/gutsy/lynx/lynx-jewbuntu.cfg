
# ---- Jewbuntu Classic settings (appended to Lynx's own lynx.cfg; later lines win) ----
# Start on a search page built for text browsers.
STARTFILE:https://lite.duckduckgo.com/lite/
HELPFILE:https://lynx.invisible-island.net/lynx_help/lynx_help_main.html
# GNOME Terminal on Ubuntu 7.10 runs in UTF-8.
CHARACTER_SET:utf-8
ASSUME_CHARSET:utf-8
ASSUME_LOCAL_CHARSET:utf-8
PREFERRED_CHARSET:utf-8
# Jewbuntu colours that stay readable on light and dark terminal backgrounds.
COLOR_STYLE:/opt/jewbuntu/etc/lynx.lss
DEFAULT_COLORS:TRUE
# Friendlier defaults for newcomers. Cookies are accepted without asking but kept only until
# Lynx closes (PERSISTENT_COOKIES:FALSE).
ACCEPT_ALL_COOKIES:TRUE
SET_COOKIES:TRUE
PERSISTENT_COOKIES:FALSE
USE_MOUSE:TRUE
VI_KEYS_ALWAYS_ON:FALSE
NUMBER_LINKS_ON_LEFT:FALSE
SHOW_CURSOR:FALSE
SCROLLBAR:TRUE
MINIMAL_COMMENTS:TRUE
# Certificate problems are always asked about (Lynx's default FORCE_SSL_PROMPT:prompt).
