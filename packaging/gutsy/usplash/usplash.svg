<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768">
  <!-- Jewbuntu Classic boot splash (usplash), drawn at 1024x768 and scaled for 800x600/640x480.
       Original artwork. Flat colours on purpose: usplash shows 256-colour images. -->
