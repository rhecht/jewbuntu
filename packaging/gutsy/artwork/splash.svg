<svg xmlns="http://www.w3.org/2000/svg" width="420" height="293" viewBox="0 0 420 293">
  <!-- Jewbuntu Classic login splash (gnome-session, 420x293). Original artwork. GNOME draws
       the starting programs' icons along the bottom, so that strip is kept plain. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#3a72d6"/><stop offset="1" stop-color="#1d4fa8"/>
    </linearGradient>
  </defs>
  <rect width="420" height="293" fill="url(#bg)"/>
  <path d="M0 210 C 120 185, 250 240, 420 195 L420 293 L0 293 Z" fill="#ffffff" fill-opacity="0.07"/>
  <g fill="none" stroke="#f6e7c4" stroke-width="4" stroke-linejoin="round" transform="translate(178 36)">
    <path d="M32 9 L53 45 L11 45 Z"/><path d="M32 57 L11 21 L53 21 Z"/>
  </g>
  <text x="210" y="138" text-anchor="middle" font-family="Inter" font-size="36" font-weight="600" fill="#ffffff">Jewbuntu</text>
  <text x="210" y="164" text-anchor="middle" font-family="Inter" font-size="13" fill="#dce8ff" letter-spacing="2">CLASSIC</text>
</svg>
