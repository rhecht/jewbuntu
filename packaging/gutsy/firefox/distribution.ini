; Jewbuntu Classic: settings for Firefox 3.6, through Mozilla's own customisation file
; (distribution/distribution.ini), so Mozilla's files themselves are not changed.
[Global]
id=jewbuntu-classic
version=7.10
about=Jewbuntu Classic

[Preferences]
; HTTPS goes through the computer's TLS bridge (jewbuntu-tlsbridge, 127.0.0.1:3129): Firefox 3.6
; speaks TLS 1.0 only. Plain HTTP goes direct.
network.proxy.type=1
network.proxy.ssl="127.0.0.1"
network.proxy.ssl_port=3129
network.proxy.share_proxy_settings=false
network.proxy.no_proxies_on="localhost, 127.0.0.1"
; SiteGround-hosted sites and other anti-bot filters drop old Firefox versions (a blank page);
; Firefox 52, the last for Pentium III-class computers, gets through.
general.useragent.override="Mozilla/5.0 (X11; Linux i686; rv:52.0) Gecko/20100101 Firefox/52.0 Jewbuntu-Classic/7.10"
; Jewbuntu welcome page; no first-run pages from mozilla.com, which 3.6 can no longer use.
browser.startup.homepage="file:///usr/share/jewbuntu-classic/welcome.html"
browser.startup.homepage_override.mstone="ignore"
browser.rights.3.shown=true
browser.shell.checkDefaultBrowser=false
; Mozilla stopped updating 3.6 in 2012; nothing to check for.
app.update.enabled=false
app.update.auto=false
extensions.update.enabled=false
browser.search.update=false
security.warn_entering_secure=false
security.warn_leaving_secure=false
