<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Jewbuntu Classic: readable Hebrew in fixed-width text (terminal, text editor).
     DejaVu Sans Mono has no Hebrew, and the fallback fontconfig 2.4 picked on Ubuntu 7.10 drew
     it faint and small, so DejaVu Sans (clear Hebrew) goes right after it. Latin text is
     unchanged. -->
<fontconfig>
  <match target="pattern">
    <test qual="any" name="family"><string>DejaVu Sans Mono</string></test>
    <edit name="family" mode="append"><string>DejaVu Sans</string></edit>
  </match>
</fontconfig>
