<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
<!-- Jewbuntu: the dock's Launchpad ("start") button as a Star of David on a light plate. Original artwork. -->
<defs>
<linearGradient id="plate" x1="0" y1="4" x2="0" y2="60" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EEF2F7"/></linearGradient>
</defs>
<rect x="4" y="6" width="56" height="56" rx="13.5" fill="#000000" fill-opacity="0.10"/>
<rect x="4" y="5" width="56" height="56" rx="13.5" fill="#000000" fill-opacity="0.08"/>
<rect x="4" y="4" width="56" height="56" rx="13.5" fill="url(#plate)" stroke="#000000" stroke-opacity="0.08" stroke-width="0.6"/>
<polygon fill="none" points="32.00,15.40 46.90,41.20 17.10,41.20" stroke="#0088FF" stroke-width="3.6" stroke-linejoin="round"/>
<polygon fill="none" points="32.00,49.80 17.10,24.00 46.90,24.00" stroke="#0088FF" stroke-width="3.6" stroke-linejoin="round"/>
</svg>
